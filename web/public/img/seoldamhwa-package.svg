    <path d="M150 190 Q119 215 109 253 Q103 275 101 303 M150 190 Q179 219 208 243 Q229 261 240 292" fill="none" opacity=".6"/>
    <path d="M148 192 Q130 219 128 239 M153 192 Q169 216 184 230 M150 194 Q148 215 148 228" fill="none" opacity=".45"/>
    <!-- 주름 잡힌 입구 -->
    <path d="M150 189 C132 184 115 177 102 165 Q105 156 119 153 Q132 147 145 153 Q161 146 176 153 Q190 153 199 165 C186 178 169 184 150 189Z" fill="#F7F2E7"/>
    <path d="M114 155 Q118 173 146 188 M132 151 Q133 174 148 188 M151 152 Q158 173 152 188 M173 153 Q170 174 154 188 M189 157 Q180 178 155 188" fill="none" stroke-width="1"/>
