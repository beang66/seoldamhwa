    <g fill="none">
      <path d="M149 189 C123 176 111 186 118 196 C125 204 139 196 149 190 M151 189 C177 176 190 186 182 196 C175 204 161 196 151 190" stroke="#2F56A8" stroke-width="2.6"/>
      <path d="M146 192 Q132 216 130 246 M154 192 Q177 214 182 247"/>
      <path d="M155 194 Q190 207 205 253" stroke="#2F56A8" stroke-width="1.4"/>
