      <path d="M68 85 Q55 70 67 64 Q79 73 68 85 M212 79 Q221 63 232 68 Q227 80 212 79 M101 58 Q86 47 89 36 Q102 39 101 58"/>
    </g>
    <!-- 앞쪽으로 겹치는 포장 천 -->
    <path d="M35 111 Q85 116 115 145 L150 188 Q77 172 35 111Z" fill="url(#package-weave)"/>
    <path d="M265 112 Q219 118 188 145 L150 188 Q218 173 265 112Z" fill="#F7F2E7"/>
    <path d="M40 115 Q79 161 143 184 M260 116 Q220 161 157 184" fill="none" stroke="#2F56A8" stroke-width="3.2"/>
