    <g transform="translate(101 215) rotate(-11)">
      <path d="M0 7 L13 0 L26 7 V46 H0Z" fill="#FBF8F1" stroke-width=".8"/>
      <circle cx="13" cy="7" r="1.7" fill="#2A2926" stroke="none"/>
