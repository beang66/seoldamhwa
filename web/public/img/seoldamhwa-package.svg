<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" role="img" aria-labelledby="title desc">
  <title id="title">설담화 복주머니형 꽃다발 패키지</title>
  <desc id="desc">꽃다발을 감싼 천과 주름진 복주머니 몸체, 여밈 끈과 작은 태그를 먹색 선과 쪽빛으로 표현한 도식.</desc>
  <defs>
